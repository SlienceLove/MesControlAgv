name: Offline release gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate redacted offline gate report
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'mes-offline-release-gate.json'
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-offline-release.ps1 -OutputPath $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate archive boundary
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'mes-offline-release-gate.json'
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-offline-release-report.ps1 -Path $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload redacted summary
        uses: actions/upload-artifact@v4
        with:
          name: offline-release-gate-${{ github.run_number }}
          path: ${{ runner.temp }}/mes-offline-release-gate.json
          if-no-files-found: error
          retention-days: 14
